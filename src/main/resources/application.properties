# =====================================================================
# FoodFlow – College Mess Management System Application Configuration
# =====================================================================

app.name=FoodFlow - College Mess Management System
app.version=1.0.0
app.institution=VIT University

# Database Settings (MySQL Default)
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/foodflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=3000&socketTimeout=3000
db.username=root
db.password=root

# H2 In-Memory Fallback Settings (Used seamlessly if MySQL server is not running)
db.fallback.enabled=true
db.fallback.driver=org.h2.Driver
db.fallback.url=jdbc:h2:mem:foodflow_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
db.fallback.username=sa
db.fallback.password=

# Pricing & Rates (per meal in INR)
meal.rate.breakfast=35.0
meal.rate.lunch=50.0
meal.rate.snacks=25.0
meal.rate.dinner=45.0
meal.rate.flat=30.0

# Reports Directory
reports.export.dir=reports/
reports.export.auto_open=true

# Security
security.salt=foodflow_salt_2026
